<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÚRSULA - Indumentaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root { 
            --accent: #cc112c; 
            --bg-light: #fff0f5; 
            --text: #444; 
            --green: #25d366; 
            --card-bg: #ffffff;
        }
        
        body { font-family: 'Nunito', sans-serif; margin: 0; background: var(--bg-light); color: var(--text); padding-bottom: 100px; display: flex; flex-direction: column; min-height: 100vh;}
        
        /* Encabezado */
        header { 
            padding: 0; 
            margin: 0; 
            background: var(--bg-light); 
            border-bottom: 4px solid var(--accent); 
            box-shadow: 0 4px 15px rgba(204, 17, 44, 0.15); 
            line-height: 0; 
            font-size: 0; 
        }
        
        /* Logo Nuevo */
        .logo-main { 
            width: 100%; 
            height: auto; 
            max-height: 450px; 
            object-fit: cover; 
            object-position: center; 
            display: block; 
            margin: 0;
            border-radius: 0;
        }

        /* Barra de Categorías */
        .category-bar { display: flex; gap: 10px; overflow-x: auto; padding: 15px 20px; background: white; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid #ffe4e1; scrollbar-width: none; justify-content: flex-start; }
        .cat-btn { padding: 10px 22px; background: #fff5f7; border: 1.5px solid #ffb6c1; color: var(--accent); border-radius: 50px; white-space: nowrap; cursor: pointer; font-family: 'Fredoka', sans-serif; font-size: 14px; transition: 0.3s; }
        .cat-btn:hover, .cat-btn.active { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(204, 17, 44, 0.2); }

        /* Contenedor */
        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; flex-grow: 1; }
        
        /* Tarjeta de Producto */
        .product-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 25px rgba(204, 17, 44, 0.08); border: 2px solid white; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); border-color: #ffb6c1; }
        
        /* Estilos del Carrusel de Imágenes */
        .img-container { width: 100%; height: 380px; background: #fff; position: relative; overflow: hidden; }
        .main-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; cursor: zoom-in; }
        
        /* Flechas del carrusel */
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.8); border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 16px; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.3s; z-index: 10; }
        .carousel-btn:hover { background: var(--accent); color: white; }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }
        .carousel-dots { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 5px; z-index: 10; pointer-events: none;}
        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.5); border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
        .dot.active { background: var(--accent); border-color: white;}

        .info { padding: 25px; flex-grow: 1; display:flex; flex-direction:column; justify-content:space-between; }
        .price { font-size: 26px; font-weight: 700; color: var(--accent); font-family: 'Fredoka', sans-serif; margin-bottom: 8px; }
        h3 { margin: 0 0 10px 0; font-size: 1.2em; color: #333; font-weight: 700; line-height: 1.3; }
        
        .talles-info-box { background: #fff5f7; border-left: 4px solid var(--accent); padding: 12px; font-size: 13px; margin: 15px 0; border-radius: 6px; color: #666; white-space: pre-line; }

        .selector-group { margin-bottom: 20px; }
        label { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; display: block; margin-top: 10px; letter-spacing: 0.5px;}
        select, input[type="number"].qty-input { width: 100%; padding: 12px; border-radius: 8px; border: 1.5px solid #ffb6c1; background: #fffcfd; font-family: 'Nunito', sans-serif; font-size: 15px; color: #444; outline: none; font-weight: 600; box-sizing: border-box; margin-top: 5px;}
        select:focus, input[type="number"].qty-input:focus { border-color: var(--accent); }
        
        /* Contenedor Flex para Talle, Color y Cantidad para que queden alineados */
        .options-flex { display: flex; gap: 10px; }
        .options-flex > div { flex: 1; }
        .qty-box { flex: 0.5 !important; } /* La cantidad ocupa un poco menos de espacio */
        
        .btn-add { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; cursor: pointer; font-weight: 700; margin-top: 15px; font-family: 'Fredoka', sans-serif; letter-spacing: 1px; transition: 0.3s; font-size: 15px; }
        .btn-add:hover { background: #9e0d22; box-shadow: 0 6px 15px rgba(204, 17, 44, 0.3); }
        
        /* Footer / Contacto */
        footer { background: white; padding: 30px 20px; text-align: center; border-top: 2px solid #ffd1dc; margin-top: 40px; }
        .social-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .social-btn { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--accent); font-weight: 700; padding: 12px 25px; border-radius: 50px; background: #fff5f7; border: 1.5px solid #ffb6c1; transition: 0.3s; font-family: 'Fredoka', sans-serif; }
        .social-btn:hover { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(204, 17, 44, 0.2); }
        .locations { color: #666; font-size: 14px; font-weight: 700; background: #fff5f7; display: inline-block; padding: 10px 20px; border-radius: 10px; border: 1px solid #ffe4e1; }
        
        /* Carrito */
        .cart-float { position: fixed; bottom: 30px; right: 30px; background: var(--green); color: white; padding: 18px 30px; border-radius: 50px; cursor: pointer; display: none; z-index: 100; font-weight: 700; border: none; box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4); font-family: 'Nunito', sans-serif; font-size: 16px; transition: transform 0.2s; }
        .cart-float:hover { transform: scale(1.05); }
        
        /* Modales */
        .modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(255,240,245,0.9); z-index: 200; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: white; padding: 35px; border-radius: 25px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(204,17,44,0.15); border: 2px solid #ffe4e1; }

        #zoom-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); z-index: 1000; justify-content:center; align-items:center; cursor: zoom-out; }
        #zoom-overlay img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 10px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }

        /* Ajustes celulares */
        @media (max-width: 600px) {
            .logo-main { height: 200px; }
            .container { grid-template-columns: 1fr; gap: 25px; }
            .img-container { height: 350px; }
            .social-btn { width: 100%; justify-content: center; }
            .cart-float { bottom: 20px; right: 20px; padding: 15px 25px; font-size: 14px; }
        }
    </style>
</head>
<body>

<header>
    <img src="https://i.postimg.cc/ryJCcc74/Bannertienda.png" class="logo-main" alt="Úrsula Indumentaria">
</header>

<div class="category-bar" id="category-bar"></div>

<div class="container" id="catalogo">
    <p style="text-align: center; grid-column: 1/-1; padding: 50px; color: #a0a0a0; font-size: 1.1em;">Preparando la colección...</p>
</div>

<footer>
    <div class="social-links">
        <a href="https://instagram.com/ursula.indumentariaa" target="_blank" class="social-btn">
            📸 @ursula.indumentariaa
        </a>
        <a href="https://wa.me/5493775461122" target="_blank" class="social-btn">
            💬 3775-461122
        </a>
    </div>
    <div class="locations">
        📍 Paraná, Entre Ríos &nbsp;|&nbsp; 📍 Monte Caseros, Corrientes
    </div>
</footer>

<button class="cart-float" id="cart-float" onclick="abrirModal()">
    🛍️ Ver Pedido (<span id="cart-count">0</span>)
</button>

<div id="zoom-overlay" onclick="this.style.display='none'">
    <img id="img-zoom-target" src="">
</div>

<div class="modal" id="modal-cliente">
    <div class="modal-content">
        <h2 style="color:var(--accent); margin-top:0; text-align:center; font-family: 'Fredoka', sans-serif; border-bottom: 2px dashed #ffb6c1; padding-bottom: 15px;">Tu Carrito</h2>
        
        <div id="resumen-carrito" style="margin-bottom:20px; max-height: 280px; overflow-y: auto;"></div>
        
        <label style="margin-top:0">Tu Nombre y Apellido:</label>
        <input type="text" id="nombre-cliente" placeholder="Ej: Sofía Martínez" style="width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #ffe4e1; margin-bottom: 20px; box-sizing: border-box; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600; background: #fffcfd;">
        
        <button onclick="finalizarPedido()" style="background:var(--green); color:white; border:none; padding:18px; border-radius:12px; width:100%; font-weight:700; cursor:pointer; font-family: 'Nunito', sans-serif; font-size: 16px; letter-spacing: 0.5px;">ENVIAR POR WHATSAPP</button>
        <button onclick="cerrarModal()" style="background:none; border:none; color:#999; margin-top:15px; cursor:pointer; width:100%; font-size:14px; font-weight: 600; text-decoration: underline;">Seguir mirando ropa</button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://hnnixqelbkuyfplnncci.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zjD9Q4lUlodn7XtRwF0W_A_LttLpWGa";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const WHATSAPP_NUMERO = "5493775461122";
    
    let productosAll = [];
    let carrito = [];
    const categoriasMenu = ["Todo", "Remeras & Tops", "Camisas", "Pantalones", "Sweaters & Buzos", "Blazers & Camperas", "Shorts & Polleras", "Monos & Vestidos", "Blusas"];
    
    // Objeto para guardar el índice de la foto actual de cada producto que tenga carrusel
    let carruselIndices = {};

    async function cargarProductos() {
        const { data, error } = await supabaseClient.from('productos').select('*').order('created_at', {ascending: false});
        if(error) return;
        productosAll = data || [];
        
        const bar = document.getElementById('category-bar');
        bar.innerHTML = categoriasMenu.map(c => `<button class="cat-btn ${c==='Todo'?'active':''}" onclick="filtrar('${c}', this)">${c}</button>`).join('');
        
        renderizar(productosAll);
    }

    function filtrar(cat, el) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        const filtered = (cat === 'Todo') ? productosAll : productosAll.filter(p => p.marca === cat);
        renderizar(filtered);
    }

    function abrirZoom(url) {
        document.getElementById('img-zoom-target').src = url;
        document.getElementById('zoom-overlay').style.display = 'flex';
    }

    // Funciones para manejar el paso de imágenes en el carrusel
    window.cambiarFoto = function(id, direccion, urlsStr) {
        const urls = urlsStr.split(',').map(u => u.trim()).filter(u => u !== '');
        if (urls.length <= 1) return;

        if (carruselIndices[id] === undefined) carruselIndices[id] = 0;
        
        carruselIndices[id] += direccion;
        
        if (carruselIndices[id] >= urls.length) carruselIndices[id] = 0;
        if (carruselIndices[id] < 0) carruselIndices[id] = urls.length - 1;

        const imgElement = document.getElementById(`main-img-${id}`);
        imgElement.src = urls[carruselIndices[id]];

        // Actualizar puntitos
        const dots = document.querySelectorAll(`#dots-${id} .dot`);
        dots.forEach((dot, index) => {
            if(index === carruselIndices[id]) dot.classList.add('active');
            else dot.classList.remove('active');
        });
    };

    function renderizar(lista) {
        const contenedor = document.getElementById('catalogo');
        if(lista.length === 0) { contenedor.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#999; font-style:italic;">No hay prendas cargadas todavía.</p>'; return; }
        
        contenedor.innerHTML = lista.map(p => {
            // Lógica para detectar si hay varias fotos separadas por coma
            const fotosArray = p.imagen_url ? p.imagen_url.split(',').map(f => f.trim()).filter(f => f !== '') : [];
            const primeraFoto = fotosArray.length > 0 ? fotosArray[0] : '';
            const tieneCarrusel = fotosArray.length > 1;
            carruselIndices[p.id] = 0; // Inicializar índice para este producto
            const arraySeguro = p.imagen_url ? p.imagen_url.replace(/'/g, "\\'") : ''; // Escapar comillas simples para la función onClick

            let controlesCarrusel = '';
            if(tieneCarrusel) {
                const puntitos = fotosArray.map((f, i) => `<div class="dot ${i===0?'active':''}"></div>`).join('');
                controlesCarrusel = `
                    <button class="carousel-btn prev" onclick="event.stopPropagation(); cambiarFoto('${p.id}', -1, '${arraySeguro}')">❮</button>
                    <button class="carousel-btn next" onclick="event.stopPropagation(); cambiarFoto('${p.id}', 1, '${arraySeguro}')">❯</button>
                    <div class="carousel-dots" id="dots-${p.id}">${puntitos}</div>
                `;
            }

            return `
            <div class="product-card">
                <div class="img-container">
                    <img src="${primeraFoto}" class="main-img" id="main-img-${p.id}" onclick="abrirZoom(this.src)">
                    ${controlesCarrusel}
                </div>

                <div class="info">
                    <div>
                        <div class="price">${p.categoria}</div>
                        <h3>${p.nombre}</h3>
                        ${p.tabla_talles ? `<div class="talles-info-box">${p.tabla_talles}</div>` : ''}
                    </div>

                    <div>
                        <div class="selector-group">
                            <div class="options-flex">
                                <div>
                                    <label>Talle</label>
                                    <select id="talle-${p.id}">
                                        ${p.descripcion ? p.descripcion.split(',').map(t => `<option>${t.trim()}</option>`).join('') : '<option>Único</option>'}
                                    </select>
                                </div>
                                <div>
                                    <label>Color</label>
                                    <select id="color-${p.id}">
                                        ${p.marca_detalle ? p.marca_detalle.split(',').map(c => `<option>${c.trim()}</option>`).join('') : '<option>Único</option>'}
                                    </select>
                                </div>
                                <div class="qty-box">
                                    <label>Cant.</label>
                                    <input type="number" id="cant-${p.id}" class="qty-input" value="1" min="1" max="20">
                                </div>
                            </div>
                        </div>
                        <!-- Se pasa el string completo de imagenes por si cambian de foto antes de comprar, guardamos la principal -->
                        <button class="btn-add" onclick="agregarAlCarrito(event, '${p.id}', '${p.nombre}', '${p.categoria}', '${primeraFoto}')">LO QUIERO 💖</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function agregarAlCarrito(event, id, nombre, precioVenta, foto) {
        const talle = document.getElementById(`talle-${id}`).value;
        const color = document.getElementById(`color-${id}`).value;
        const cantidad = parseInt(document.getElementById(`cant-${id}`).value) || 1;
        
        // Agregar al carrito el objeto con la cantidad elegida
        carrito.push({ nombre, precioVenta, talle, color, foto, cantidad });
        
        document.getElementById('cart-float').style.display = 'block';
        
        // Actualizar contador del carrito (sumando cantidades)
        const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
        document.getElementById('cart-count').innerText = totalItems;
        
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "¡AGREGADO ✔️!";
        btn.style.background = "var(--green)";
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "var(--accent)";
            document.getElementById(`cant-${id}`).value = 1; // Resetear cantidad a 1 después de agregar
        }, 1500);
    }

    function abrirModal() {
        const resumen = document.getElementById('resumen-carrito');
        if(carrito.length === 0) {
            resumen.innerHTML = "<p style='text-align:center; color:#999'>Tu pedido está vacío.</p>";
        } else {
            resumen.innerHTML = carrito.map((i, index) => `
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center; border-bottom:1px solid #fff0f5; padding-bottom:10px;">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img src="${i.foto}" style="width:55px; height:55px; object-fit:cover; border-radius:10px; border:1px solid #ffe4e1;">
                        <div style="line-height:1.3">
                            <b style="font-size:14px; color:#333;">${i.cantidad}x ${i.nombre}</b><br>
                            <small style="color:#777;">${i.talle} / ${i.color}</small>
                        </div>
                    </div>
                    <div style="text-align:right">
                        <b style="color:var(--accent); font-size:15px; font-family:'Fredoka', sans-serif;">${i.precioVenta}</b><br>
                        <small style="color:#ff6b6b; cursor:pointer; font-size:11px; font-weight:700; text-transform:uppercase;" onclick="eliminarDelCarrito(${index})">Eliminar</small>
                    </div>
                </div>`).join('');
        }
        document.getElementById('modal-cliente').style.display = 'flex';
    }

    function eliminarDelCarrito(index) {
        carrito.splice(index, 1);
        const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
        document.getElementById('cart-count').innerText = totalItems;
        if(carrito.length === 0) document.getElementById('cart-float').style.display = 'none';
        abrirModal();
    }

    function cerrarModal() { document.getElementById('modal-cliente').style.display = 'none'; }

    async function finalizarPedido() {
        const cliente = document.getElementById('nombre-cliente').value;
        if (!cliente) return alert("Por favor, escribí tu nombre para saber de quién es el pedido.");
        if (carrito.length === 0) return alert("El carrito está vacío.");

        let textoWhatsApp = `¡Hola Úrsula! Soy *${cliente}* y quiero encargar esto:\n\n`;
        let linksFotos = carrito.map(i => i.foto).join(',');

        carrito.forEach((item) => {
            textoWhatsApp += `👚 *${item.cantidad}x ${item.nombre}*\n   Talle: ${item.talle} | Color: ${item.color}\n   Precio U.: ${item.precioVenta}\n\n`;
        });
        
        const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
        textoWhatsApp += `Total de prendas: ${totalItems}`;

        const { error } = await supabaseClient.from('pedidos').insert([{ 
            cliente, 
            detalles: textoWhatsApp, 
            total: totalItems + " items", 
            estado: "NUEVO", 
            fotos_pedido: linksFotos 
        }]);

        if(!error) {
            window.open(`https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(textoWhatsApp)}`, '_blank');
            carrito = [];
            location.reload();
        } else {
            alert("Hubo un error al enviar el pedido.");
        }
    }
    cargarProductos();
</script>
</body>
</html>
