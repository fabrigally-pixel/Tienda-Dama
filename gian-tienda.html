<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ÚRSULA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff0f5; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 500px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; background: #e0e0e0; font-weight: bold; }
        .tab-btn.active { background: #cc112c; color: white; }
        .section { display: none; width: 100%; max-width: 500px; }
        .section.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #f8c8d8; margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        label { display: block; margin-top: 15px; font-weight: 600; color: #555; font-size: 12px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #f8c8d8; border-radius: 10px; box-sizing: border-box; font-size: 16px; background: #fffcfd; }
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; background:#cc112c; color:white; font-size: 16px; }
        .prod-item { display:flex; align-items:center; gap:10px; border-bottom:1px solid #eee; padding:10px 0; }
        .order-card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid #cc112c; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .fotos-pedido { display: flex; gap: 5px; overflow-x: auto; margin-top: 10px; padding-bottom: 5px; }
        .fotos-pedido img { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; background: #fafafa; padding: 10px; border-radius: 10px; border: 1px solid #eee; }
        .filter-bar input, .filter-bar select { margin: 0; padding: 8px; font-size: 14px; }
        .help-text { font-size: 11px; color: #888; margin-top: -3px; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('carga', this)">📦 Stock</button>
    <button class="tab-btn" onclick="switchTab('pedidos', this)">🛍️ Pedidos</button>
    <button class="tab-btn" onclick="switchTab('historial', this)">📜 Historial</button>
</div>

<div id="sec-carga" class="section active">
    
    <div class="card">
        <h2 id="form-title" style="margin:0; color:#cc112c;">Cargar Nueva Prenda</h2>
        <input type="hidden" id="edit-id">

        <label>Categoría</label>
        <select id="categoria-prenda">
            <option>Remeras & Tops</option><option>Camisas</option><option>Pantalones</option>
            <option>Sweaters & Buzos</option><option>Blazers & Camperas</option>
            <option>Shorts & Polleras</option><option>Monos & Vestidos</option><option>Blusas</option>
        </select>
        
        <label>Nombre de la prenda</label>
        <input type="text" id="nombre" placeholder="Ej: Remera Lisa Algodón">
        
        <label>Precio de Venta ($)</label>
        <input type="number" id="precio_final" placeholder="Ej: 15000">

        <label>Enlace de la Foto Principal</label>
        <span class="help-text">Subí tu foto a postimages.org y pegá acá el "Enlace directo"</span>
        <input type="text" id="img_url" placeholder="https://i.postimg.cc/...">

        <label>Talles Disponibles</label>
        <input type="text" id="talles" placeholder="Ej: S, M, L (Separados por coma)">
        
        <label>Colores</label>
        <input type="text" id="colores" placeholder="Ej: Blanco, Negro, Rojo">
        
        <label>Descripción Extra / Info de Talles</label>
        <textarea id="tabla_talles_text" placeholder="Medidas o detalles de la tela..."></textarea>
        
        <button id="btn-action" onclick="guardarProducto()" class="btn-main">Guardar Prenda</button>
        <button id="btn-cancel" onclick="location.reload()" style="display:none; width:100%; background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">Cancelar Edición</button>
    </div>
    
    <div class="card">
        <h3>Tu Stock Cargado</h3>
        <div class="filter-bar">
            <input type="text" id="busqueda" placeholder="🔍 Buscar..." oninput="filtrarStock()" style="flex:1;">
            <select id="filtro-categoria" onchange="filtrarStock()" style="flex:1;">
                <option value="Todo">Categorías</option>
                <option>Remeras & Tops</option><option>Camisas</option><option>Pantalones</option>
                <option>Sweaters & Buzos</option><option>Blazers & Camperas</option>
                <option>Shorts & Polleras</option><option>Monos & Vestidos</option><option>Blusas</option>
            </select>
        </div>
        <p id="contador-stock" style="font-size:12px; color:#666; margin-top:0; text-align:right;">Cargando...</p>
        <div id="lista-productos"></div>
    </div>
</div>

<div id="sec-pedidos" class="section"><div id="lista-pedidos"></div></div>
<div id="sec-historial" class="section"><div id="lista-historial"></div></div>

<script>
    const SUPABASE_URL = "https://hnnixqelbkuyfplnncci.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zjD9Q4lUlodn7XtRwF0W_A_LttLpWGa";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let globalProductos = [];

    function filtrarStock() {
        const busqueda = document.getElementById('busqueda').value.toLowerCase();
        const cat = document.getElementById('filtro-categoria').value;
        const filtrados = globalProductos.filter(p => {
            const coincideNombre = p.nombre.toLowerCase().includes(busqueda);
            const coincideCat = (cat === "Todo") || (p.marca === cat);
            return coincideNombre && coincideCat;
        });
        renderizarStock(filtrados);
    }

    function renderizarStock(lista) {
        document.getElementById('contador-stock').innerText = `Viendo ${lista.length} de ${globalProductos.length} prendas`;
        const contenedor = document.getElementById('lista-productos');
        if(lista.length === 0) { contenedor.innerHTML = '<p style="text-align:center; color:#999;">No hay prendas.</p>'; return; }

        contenedor.innerHTML = lista.map(p => `
            <div class="prod-item">
                <img src="${p.imagen_url}" width="40" height="40" style="object-fit:cover; border-radius:5px;">
                <div style="flex-grow:1; font-size:13px;">
                    <b>${p.nombre}</b><br>
                    <span style="color:#cc112c; font-weight:bold;">${p.categoria}</span><br>
                    <small style="color:#888">${p.marca}</small>
                </div>
                <button onclick="prepararEdicion('${p.id}')" style="background:none;border:none;font-size:18px;cursor:pointer;">✏️</button>
                <button onclick="eliminar('${p.id}')" style="background:none;border:none;font-size:18px;cursor:pointer;">🗑️</button>
            </div>`).join('');
    }

    async function guardarProducto() {
        const id = document.getElementById('edit-id').value;
        const precioNum = parseFloat(document.getElementById('precio_final').value) || 0;
        const precioTexto = "$" + precioNum.toLocaleString('es-AR');

        const datos = {
            nombre: document.getElementById('nombre').value,
            precio_costo: precioNum, 
            categoria: precioTexto, // Usamos esto para guardar el precio formateado (compatibilidad)
            imagen_url: document.getElementById('img_url').value,
            descripcion: document.getElementById('talles').value,
            marca_detalle: document.getElementById('colores').value,
            tabla_talles: document.getElementById('tabla_talles_text').value,
            fotos_extra: "", 
            marca: document.getElementById('categoria-prenda').value,
            link_origen: "" 
        };

        if(!datos.nombre || precioNum === 0) return alert("Por favor ingresá un nombre y un precio.");

        const { error } = id ? await supabaseClient.from('productos').update(datos).eq('id', id) : await supabaseClient.from('productos').insert([datos]);
        if(error) alert(error.message); else location.reload();
    }

    async function cargarLista() {
        const { data } = await supabaseClient.from('productos').select('*').order('created_at', {ascending: false});
        globalProductos = data || [];
        filtrarStock(); 
    }

    function prepararEdicion(id) {
        const p = globalProductos.find(x => x.id == id);
        if (!p) return;
        document.getElementById('edit-id').value = p.id;
        document.getElementById('nombre').value = p.nombre;
        document.getElementById('categoria-prenda').value = p.marca;
        document.getElementById('talles').value = p.descripcion;
        document.getElementById('colores').value = p.marca_detalle;
        document.getElementById('img_url').value = p.imagen_url;
        document.getElementById('tabla_talles_text').value = p.tabla_talles || '';
        document.getElementById('precio_final').value = p.precio_costo || 0;
        
        document.getElementById('form-title').innerText = "Editando Prenda";
        document.getElementById('btn-action').innerText = "Actualizar Prenda";
        document.getElementById('btn-cancel').style.display = "block";
        window.scrollTo(0,0);
    }

    async function cargarPedidos(estado, contenedor) {
        const { data } = await supabaseClient.from('pedidos').select('*').eq('estado', estado).order('created_at', {ascending: false});
        const div = document.getElementById(contenedor);
        div.innerHTML = data.map(p => {
            const fotos = p.fotos_pedido ? p.fotos_pedido.split(',') : [];
            const htmlFotos = fotos.map(f => `<a href="${f}" target="_blank"><img src="${f}"></a>`).join('');
            return `
            <div class="order-card">
                <b>👤 ${p.cliente}</b>
                <p style="font-size:12px;">${p.detalles.replace(/\n/g, '<br>')}</p>
                <div class="fotos-pedido">${htmlFotos}</div>
                ${estado==='NUEVO' ? `<button onclick="cambiarEstado('${p.id}', 'ARCHIVADO')" style="width:100%; margin-top:10px; cursor:pointer; padding:8px; background:#e0e0e0; border:none; border-radius:5px;">✅ Archivar / Entregado</button>` : ''}
            </div>`;
        }).join('') || '<p style="text-align:center; color:#999;">No hay pedidos</p>';
    }

    async function cambiarEstado(id, est) { await supabaseClient.from('pedidos').update({estado:est}).eq('id',id); switchTab('pedidos', document.querySelectorAll('.tab-btn')[1]); }
    async function eliminar(id) { if(confirm("¿Seguro que querés borrar esta prenda?")) { await supabaseClient.from('productos').delete().eq('id',id); cargarLista(); } }
    
    function switchTab(tab, el) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-' + tab).classList.add('active');
        el.classList.add('active');
        if(tab === 'pedidos') cargarPedidos('NUEVO', 'lista-pedidos');
        if(tab === 'historial') cargarPedidos('ARCHIVADO', 'lista-historial');
        if(tab === 'carga') cargarLista();
    }
    
    cargarLista();
</script>
</body>
</html>
